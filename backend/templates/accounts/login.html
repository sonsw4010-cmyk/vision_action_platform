{% extends "base.html" %}

{% block title %}로그인 - Vision Action AI{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0 rounded-3 mt-4">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-bounding-box text-primary" style="font-size: 3rem;"></i>
                    <h3 class="fw-bold mt-2">로그인</h3>
                    <p class="text-muted small">Vision AI 서비스 이용을 위해 로그인해 주세요</p>
                </div>

                {% if form.errors %}
                    <div class="alert alert-danger alert-dismissible fade show small" role="alert">
                        아이디 또는 비밀번호가 올바르지 않습니다.
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endif %}

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next|default:'/analyses/' }}">
                    
                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold">아이디</label>
                        <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" 
                               maxlength="150" required id="id_username" class="form-control" placeholder="아이디 입력">
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label fw-semibold">비밀번호</label>
                        <input type="password" name="password" autocomplete="current-password" 
                               required id="id_password" class="form-control" placeholder="비밀번호 입력">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">로그인</button>
                </form>

                <hr class="my-4">
                <div class="text-center small text-muted">
                    계정이 없으신가요? <a href="{% url 'signup' %}" class="text-decoration-none fw-semibold">회원가입</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
