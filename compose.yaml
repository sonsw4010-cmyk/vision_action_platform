services:
  # 1. 데이터베이스 서비스 (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: vision_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-vision_action_db}
      POSTGRES_USER: ${DB_USER:-user1}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password1234}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user1} -d ${DB_NAME:-vision_action_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. 비동기 작업 큐 브로커 (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: vision_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. 독립 AI 추론 서비스 (FastAPI)
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: vision_ai_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. 웹 애플리케이션 및 DRF API (Django)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vision_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-key-vision-action-2026}
      - DEBUG=${DEBUG:-True}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-vision_action_db}
      - DB_USER=${DB_USER:-user1}
      - DB_PASSWORD=${DB_PASSWORD:-password1234}
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai_service:8001
    volumes:
      - media_volume:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai_service:
        condition: service_healthy

  # 5. 비동기 분석 작업 처리기 (Celery Worker)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vision_celery_worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=2
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-key-vision-action-2026}
      - DEBUG=${DEBUG:-True}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-vision_action_db}
      - DB_USER=${DB_USER:-user1}
      - DB_PASSWORD=${DB_PASSWORD:-password1234}
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai_service:8001
    volumes:
      - media_volume:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai_service:
        condition: service_healthy

volumes:
  pgdata:
  media_volume:
